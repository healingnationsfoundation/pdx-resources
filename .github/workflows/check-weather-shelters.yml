name: Check severe weather shelters

# Every hour, read Multnomah County's "care when it's cold" page and the National
# Weather Service forecast for Portland, and update alerts.json. The guide shows a
# banner when emergency severe weather shelters are open tonight, and tonight's
# low / today's high on the home screen. Commits only when something changes
# (the forecast a few times a day, when NWS issues a new one).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide-data-commits
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read the County page
        run: node scripts/check-weather-shelters.mjs
      - name: Publish if it changed
        run: |
          if git diff --quiet -- alerts.json && git ls-files --error-unmatch alerts.json >/dev/null 2>&1; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alerts.json
          git commit -m "Weather: shelters $(node -p "require('./alerts.json').severeWeather.status"), forecast $(node -p "const p=(require('./alerts.json').forecast||{periods:[{}]}).periods[0];p.name?p.name+' '+p.temp+p.unit:'n/a'") ($(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M'))"
          git pull --rebase -q
          git push
